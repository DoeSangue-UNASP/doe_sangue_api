services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-DoeSangue_Strong_Password_2026}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C -b || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Database: "Server=sqlserver,1433;Database=DoeSangue;User Id=sa;Password=${MSSQL_SA_PASSWORD:-DoeSangue_Strong_Password_2026};TrustServerCertificate=True;"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY:-DoeSangue-Super-Secret-Key-With-At-Least-32-Chars!}"
      JwtSettings__Issuer: "${JWT_ISSUER:-DoeSangue.API}"
      JwtSettings__Audience: "${JWT_AUDIENCE:-DoeSangue.Client}"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  sqlserver-data:
